kind = "mobile"
previewPath = "/"
title = "Bird Breeder"
version = "1.0.0"
id = "artifacts/bird-breeder"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20451

[services.development]
run = "pnpm --filter @workspace/bird-breeder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bird-breeder", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bird-breeder", "run", "serve" ]

[services.env]
PORT = "20451"
BASE_PATH = "/"
